How to run everything locally (manual)


A. Change-based automation
from automation.manager import AutomationManager

am = AutomationManager()

am.run_watcher(
    url="https://news.ycombinator.com",
    task="Extract top headlines and summarize"
)


Run again → only executes if page changed.

B. Batch automation
am.run_batch(
    urls=[
        "https://news.ycombinator.com",
        "https://techcrunch.com"
    ],
    task="Extract top headlines and summarize"
)

C. Time-based automation
am.run_scheduler(
    interval_seconds=3600,
    url="https://news.ycombinator.com",
    task="Extract top headlines and summarize"
)